name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (Turbo)
        run: bun run typecheck

      - name: Frontend lint (Biome)
        run: bun run check

      - name: Push schema to test database
        working-directory: apps/backend
        run: bun run db:push

      - name: Unit tests (Turbo)
        run: bun run test

      - name: Frontend build (Turbo)
        run: bun run build

  e2e:
    name: Playwright e2e (chromium + firefox)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORT: "8000"
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:8000
      BETTER_AUTH_SECRET: ci-test-secret-not-for-production
      VITE_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Push schema to test database
        working-directory: apps/backend
        run: bun run db:push

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: bun run test:e2e:install --with-deps

      - name: Run e2e tests
        working-directory: apps/frontend
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7
